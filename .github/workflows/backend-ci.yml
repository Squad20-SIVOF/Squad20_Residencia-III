name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de Formatação (Prettier)
        run: npm run format:check

      - name: Checagem de Lint (ESLint)
        run: npm run lint

      - name: Checagem de Tipos (TypeScript)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes Unitários e Cobertura
        run: npm run test:push

      - name: Salvar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy no Render
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Publicar commit validado
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::error::Configure o secret RENDER_DEPLOY_HOOK_URL com o Deploy Hook do serviço frotamanager-api."
            exit 1
          fi
          curl --fail --silent --output /dev/null --max-time 120 \
            --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_SHA}"
          echo "Deploy solicitado ao Render para o commit ${DEPLOY_SHA}." >> "$GITHUB_STEP_SUMMARY"
